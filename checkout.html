<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Pedi And Mani Home Salon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" class="logo-link" title="Go to Home">
                        <h1><i class="fas fa-spa"></i> Pedi And Mani</h1>
                        <p>Home Salon Services</p>
                    </a>
                </div>
                <div class="header-info">
                    <div class="contact-info">
                        <i class="fas fa-phone"></i>
                        <span>+91 7975133457</span>
                    </div>
                    <div class="women-owned-badge">
                        <i class="fas fa-venus"></i>
                        <span>Women Owned</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Title -->
            <section class="page-title">
                <h2>Checkout</h2>
                <p>Review your selected services</p>
            </section>

            <!-- Cart Summary -->
            <section class="checkout-summary">
                <div class="cart-items" id="cartItems">
                    <!-- Cart items will be dynamically loaded here -->
                </div>
                
                <div class="cart-summary-footer">
                    <div class="total-amount">
                        <h3>Total Amount: ₹<span id="totalAmount">0</span></h3>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="checkout-actions">
                <button class="back-btn" id="backBtn">
                    <i class="fas fa-arrow-left"></i>
                    Back to Home
                </button>
                <button class="schedule-btn" id="scheduleBtn">
                    Schedule Booking
                    <i class="fas fa-calendar"></i>
                </button>
            </section>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Scripts -->
    <script src="services.js"></script>
    <script src="storage.js"></script>
    <script src="cart.js"></script>
    <script src="utils.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
