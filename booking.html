<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Booking - Pedi And Mani Home Salon</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <a href="index.html" class="logo-link" title="Go to Home">
                        <h1><i class="fas fa-spa"></i> Pedi And Mani</h1>
                        <p>Home Salon Services</p>
                    </a>
                </div>
                <div class="header-info">
                    <div class="contact-info">
                        <i class="fas fa-phone"></i>
                        <span>+91 7975133457</span>
                    </div>
                    <div class="women-owned-badge">
                        <i class="fas fa-venus"></i>
                        <span>Women Owned</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Page Title -->
            <section class="page-title">
                <h2>Schedule Your Booking</h2>
                <p>Fill in your details to complete the booking</p>
            </section>

            <!-- Booking Form -->
            <section class="booking-form-section">
                <form class="booking-form" id="bookingForm">
                    <!-- Personal Information -->
                    <div class="form-section">
                        <h3>Personal Information</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="firstName">First Name *</label>
                                <input type="text" id="firstName" name="firstName" required>
                                <span class="error-message" id="firstNameError"></span>
                            </div>
                            <div class="form-group">
                                <label for="lastName">Last Name *</label>
                                <input type="text" id="lastName" name="lastName" required>
                                <span class="error-message" id="lastNameError"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Address Information -->
                    <div class="form-section">
                        <h3>Address Information</h3>
                        <div class="form-group">
                            <label for="houseNumber">House Number *</label>
                            <input type="text" id="houseNumber" name="houseNumber" required>
                            <span class="error-message" id="houseNumberError"></span>
                        </div>
                        <div class="form-group">
                            <label for="lane">Lane/Society Name/Street/Area *</label>
                            <input type="text" id="lane" name="lane" required>
                            <span class="error-message" id="laneError"></span>
                        </div>
                        <div class="form-group">
                            <label for="city">City *</label>
                            <input type="text" id="city" name="city" required>
                            <span class="error-message" id="cityError"></span>
                        </div>
                        <div class="form-group">
                            <button type="button" class="location-btn" id="getLocationBtn">
                                <i class="fas fa-map-marker-alt"></i>
                                Get Location
                            </button>
                            <span class="location-status" id="locationStatus"></span>
                        </div>
                    </div>

                    <!-- Contact Information -->
                    <div class="form-section">
                        <h3>Contact Information</h3>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" maxlength="10" required>
                            <span class="error-message" id="phoneError"></span>
                        </div>
                    </div>

                    <!-- Booking Schedule -->
                    <div class="form-section">
                        <h3>Booking Schedule</h3>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="bookingDate">Date of Booking *</label>
                                <input type="date" id="bookingDate" name="bookingDate" required>
                                <span class="error-message" id="bookingDateError"></span>
                            </div>
                            <div class="form-group">
                                <label for="bookingTime">Time of Booking *</label>
                                <select id="bookingTime" name="bookingTime" required>
                                    <option value="">Select Time</option>
                                    <option value="09:00">09:00 AM</option>
                                    <option value="10:00">10:00 AM</option>
                                    <option value="11:00">11:00 AM</option>
                                    <option value="12:00">12:00 PM</option>
                                    <option value="13:00">01:00 PM</option>
                                    <option value="14:00">02:00 PM</option>
                                    <option value="15:00">03:00 PM</option>
                                    <option value="16:00">04:00 PM</option>
                                    <option value="17:00">05:00 PM</option>
                                    <option value="18:00">06:00 PM</option>
                                </select>
                                <span class="error-message" id="bookingTimeError"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Order Summary -->
                    <div class="form-section">
                        <h3>Order Summary</h3>
                        <div class="order-summary" id="orderSummary">
                            <!-- Order summary will be dynamically loaded here -->
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="form-actions">
                        <button type="submit" class="pay-btn" id="payBtn" disabled>
                            Pay and Book
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </form>
            </section>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
    </div>

    <!-- Scripts -->
    <script src="services.js"></script>
    <script src="storage.js"></script>
    <script src="cart.js"></script>
    <script src="utils.js"></script>
    <script src="booking.js"></script>
</body>
</html>
